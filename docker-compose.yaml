services:
  backtester:
    build:
      context: ./backtester
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.14-slim}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload &
             streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./backtester:/app
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - ./secrets/secret.env
    environment:
      - DATABASE_URL=postgresql://backtester:backtester@db:5432/backtester
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=pattern_finder

  mongo:
    image: ${MONGO_BASE_IMAGE:-mongo:7}
    command: ["mongod", "--bind_ip_all", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      # 호스트 bind-mount — 데이터가 이미지에 포함되지 않아 이미지 크기 유지.
      # ``./mongodata``는 .gitignore에 등록되어 트래킹 안 됨.
      - ./mongodata:/data/db

  db:
    image: ${POSTGRES_BASE_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=backtester
      - POSTGRES_PASSWORD=backtester
      - POSTGRES_DB=backtester
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb-only: alphafolio role + database creation. Runs once
      # when the pgdata volume is first initialized.
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtester"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # alphafolio stack — 3 microservices sharing the `db` Postgres cluster
  # via a dedicated `alphafolio` DB (created by db_init/01_*.sql). Each
  # service mirrors its Railway deployment but talks over the compose
  # network instead of public URLs.
  # ------------------------------------------------------------------

  alphafolio_data:
    build:
      context: ./alphafolio_data
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    volumes:
      - ./alphafolio_data:/app
      - alphafolio_data_logs:/app/log
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - ./secrets/alphafolio.env
    environment:
      - DATABASE_URL=postgresql://alphafolio:alphafolio@db:5432/alphafolio
      - QUANT_SERVICE_URL=http://alphafolio_quant:8000
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=alphafolio
      - PORT=8000

  alphafolio_quant:
    build:
      context: ./alphafolio_quant
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./alphafolio_quant:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./secrets/alphafolio.env
    environment:
      - DATABASE_URL=postgresql://alphafolio:alphafolio@db:5432/alphafolio
      - PORTFOLIO_SERVICE_URL=http://alphafolio_portfolio:7000
      - DATA_SERVICE_URL=http://alphafolio_data:8000

  alphafolio_portfolio:
    build:
      context: ./alphafolio_portfolio
      dockerfile: Dockerfile
    ports:
      - "7001:7000"
    volumes:
      - ./alphafolio_portfolio:/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./secrets/alphafolio.env
    environment:
      - DATABASE_URL=postgresql://alphafolio:alphafolio@db:5432/alphafolio

  # ------------------------------------------------------------------
  # Backtest runner — date-loop orchestrator. Idle by default (profile),
  # invoke explicitly:
  #
  #   docker compose run --rm alphafolio_backtest \
  #       python runner.py --start 2024-01-01 --end 2024-12-31 \
  #                        --country US --bt-id bt_us_2024
  # ------------------------------------------------------------------

volumes:
  pgdata:
  alphafolio_data_logs:
