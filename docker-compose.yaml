services:
  backtester:
    build:
      context: ./backtester
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.14-slim}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload &
             streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./backtester:/app
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    env_file:
      - ./secrets/secret.env
    environment:
      - DATABASE_URL=postgresql://backtester:backtester@db:5432/backtester
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=pattern_finder

  mongo:
    image: ${MONGO_BASE_IMAGE:-mongo:7}
    command: ["mongod", "--bind_ip_all", "--quiet"]
    ports:
      - "27017:27017"
    volumes:
      # 호스트 bind-mount — 데이터가 이미지에 포함되지 않아 이미지 크기 유지.
      # ``./mongodata``는 .gitignore에 등록되어 트래킹 안 됨.
      - ./mongodata:/data/db

  db:
    image: ${POSTGRES_BASE_IMAGE:-postgres:16-alpine}
    environment:
      - POSTGRES_USER=backtester
      - POSTGRES_PASSWORD=backtester
      - POSTGRES_DB=backtester
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtester"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
